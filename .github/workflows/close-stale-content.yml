name: 'Close stale issues and PRs'
on:
  schedule:
    - cron: '30 1 * * *'

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v4
        with:
          stale-issue-message: 'This issue is stale because it has been open 30 days with no activity. Please be kindly reminded to work on this issue'
          stale-pr-message: 'This PR is stale because it has been open 45 days with no activity. Is there still progress on this PR? '
          days-before-stale: 30
          days-before-pr-stale: 45
