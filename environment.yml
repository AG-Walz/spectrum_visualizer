name: mspecviz
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - scipy
  - matplotlib
  - plotly
  - seaborn
  - pyopenms
  - pyarrow
  - pyyaml
  - streamlit>=1.48.0
  - openpyxl
  - pytest
  - joblib
  - tqdm
  - pip:
    - psm-utils
    - koinapy
    - ms-entropy
    - spectrum-utils>=0.4.2
    - altair
    - polars
    - openms-insight>=0.1.11
    - pyopenms-viz
    - joypy
