name: mspecviz
channels:
  # conda-forge MUST be highest priority (Bioconda requirement): CI's micromamba
  # uses strict channel priority, so with bioconda first the solver locks libsvm/
  # coinmp to bioconda (which lacks matching builds) and pyopenms 3.4.1 becomes
  # uninstallable. `nodefaults` drops the Anaconda `defaults` channel (ToS-gated on
  # CI, and it shadows conda-forge repodata). Local solves worked only because the
  # dev machine uses flexible priority.
  - conda-forge
  - bioconda
  - nodefaults
# Every version is pinned to the known-good set the test suite runs against.
# CI rebuilds this environment from scratch on each run, so an unpinned
# dependency lets CI silently drift onto an untested release. Bump versions
# deliberately (and together), never by leaving a spec open.
dependencies:
  - python=3.11
  - pip
  - numpy=2.4.2
  - pandas=2.3.3
  - scipy=1.17.0
  - matplotlib=3.10.8
  - plotly=6.5.2
  - seaborn=0.13.2
  - pyopenms=3.4.1
  - pyarrow=22.0.0
  - pyyaml=6.0.3
  - streamlit=1.53.1
  - openpyxl=3.1.5
  - pytest=9.0.2
  - joblib=1.5.3
  - tqdm=4.67.2
  - psutil=7.1.3
  - pip:
    - psm-utils==1.5.1
    - koinapy==0.0.10
    - ms-entropy==1.4.0
    - spectrum-utils==0.5.0
    - altair==6.0.0
    - polars==1.39.3
    - openms-insight==0.1.13
    - pyopenms-viz==1.0.1