# MSpecViz CLI config — run: python -m cli cli/config/config_example.yaml
# Full reference: docs/cli/usage.md
#
# Every key name below matches a default parameter in mspecviz/common/defaults.py
# (with CLI-only extras for the inputs section). Edit the values to point to your 
# data and adjust settings as needed. 

# --- 1. Main parameters ---

# Paths are relative to the project root (run the CLI from there).
idxml_files:
  - examples/idXML/ProT001_1_pout_filtered.idXML
mzml_files:
  - examples/mzML/231204_DF_ProCa_ProT001_*.mzML

# "/path/to/peptides.txt" | [PEPTIDE1, PEPTIDE2, ...]
# A .txt file must hold one peptide per line (commas are not separators).
peptide_source: examples/peptides.txt

# Substring that marks reference mzMLs; leave empty for single-spectrum mode
# or prediction only.
reference_substring: ""

export_directory: ./exports           # base path for versioned run dirs
project_name: MSpecViz_analysis       # prefix of the run dir name
export_formats: [png]                 # png, svg, pdf, html
export_resolution: 300                       # raster resolution
figure_size: [12, 8]                  # [width, height] in inches
plot_unpaired_queries: false          # also render queries with no reference
max_peak_labels: 20                   # label only the N most intense peaks per panel; 0 = all

# --- 2. Sensible defaults ---

ion_types: [b, y]                     # a, b, c, x, y, z, internal, precursor, immonium
mz_tolerance: 0.02                    # Da
add_neutral_losses: false             # H2O, NH3 losses
intensity_mode: Relative              # Relative (base-peak normalised) or Raw

workers: 4                            # 1 = sequential (easier debugging)

# summary_metrics: [R² binned]                   # one set of summary plots per listed measure
# summary_plot_types: [ridgeline, multi_boxplot]  # any subset of {ridgeline, multi_boxplot}

# --- 3. Advanced / optional parameters ---

# Koina generates a predicted reference when no experimental one exists.
# Requires network access to koina.wilhelmlab.org.
# Full model list: streamlit_app/config/settings.json → "models"
koina_enabled: false
koina_model: ms2pip_timsTOF2024
koina_collision_energy: 35
koina_instrument_type: TIMSTOF        # QE, LUMOS, TIMSTOF, SCIEXTOF
